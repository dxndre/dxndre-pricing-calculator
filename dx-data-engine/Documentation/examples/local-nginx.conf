    # DX. Data Engine: public static files only; never route a missing dataset to PHP.
    location = /wp-json/dxndre/v1/gym-dashboard { return 410; }
    location = /wp-json/dxndre/v1/gym-dashboard/ { return 410; }
    location = /fitness/gyms {
        return 301 /fitness/gyms/$is_args$args;
    }
    location = /fitness/gyms/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        default_type text/html;
        try_files /wp-content/uploads/dx-data/gyms/index.html @dx_data_unavailable;
        add_header Cache-Control "public, max-age=60, must-revalidate" always;
        add_header X-DX-Data-Shell "nginx-static" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~ "^/wp-content/uploads/dx-data/[a-z][a-z0-9-]{0,31}/dataset\.[a-f0-9]{64}\.json$" {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        default_type application/json;
        try_files $uri @dx_data_missing;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~ "^/wp-content/uploads/dx-data/[a-z][a-z0-9-]{0,31}/(?:manifest\.json|index\.html)$" {
        add_header X-Robots-Tag "noindex" always;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        try_files $uri @dx_data_missing;
        add_header Cache-Control "public, max-age=60, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location /wp-content/uploads/dx-data/ { return 410; }
    location @dx_data_missing { add_header Cache-Control "no-store" always; return 410; }
    location @dx_data_unavailable {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "300" always;
        return 503 '<!doctype html><html lang="en"><title>Information temporarily unavailable</title><h1>Taking a short pause.</h1><p>Please return shortly.</p></html>';
    }
